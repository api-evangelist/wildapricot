openapi: 3.2.0
info:
  title: WildApricot Admin Accounts Events.Event Registrations API
  description: The WildApricot Admin API provides programmatic access to membership management features including contacts, events, event registrations, membership levels, invoices, payments, donations, email campaigns, and store orders. Authentication uses OAuth2 with client credentials or authorization code flow.
  version: 7.24.0
  contact:
    name: WildApricot Support
    url: https://gethelp.wildapricot.com/
  license:
    name: Proprietary
  x-generated-from: documentation
servers:
- url: https://api.wildapricot.org/v2.2
  description: WildApricot Admin API v2.2
tags:
- name: Events.EventRegistrations
paths:
  /accounts/{accountId}/eventregistrations:
    get:
      operationId: GetEventRegistrationsList
      summary: WildApricot Event Registrations List
      description: 'âš  There are 3 parameters, which cannot be used simultaneously. API uses only one parameter of contactId, eventId, $filter or ids exactly in this order. For example if request contains both contactId and eventId, then API uses only contactId to filter event registrations. âš  Request parameter is required

        '
      tags:
      - Events.EventRegistrations
      parameters:
      - name: ''
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: contactId
        in: query
        required: false
        description: contact identifier
        schema:
          type: integer
      - name: eventId
        in: query
        required: false
        description: event identifier
        schema:
          type: integer
      - name: $filter
        in: query
        required: false
        description: "Filters the results of the Events API call so that only those records that match the filter criteria are included. The following filter criterias are supported:\n  - Id, Supported operations: in.\n    example: ?$filter=id in [1,2,3,4â€¦.]\n"
        schema:
          type: string
      - name: includeDetails
        in: query
        required: false
        description: If false, registration form data is not retrieved
        schema:
          type: boolean
      - name: includeWaitlist
        in: query
        required: false
        description: Defines if waitlist records should be included in result
        schema:
          type: boolean
      responses:
        '200':
          description: List of event registrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationsResponse'
        '400':
          description: ''
        '401':
          description: ''
        '429':
          description: ''
      security:
      - OAuth2:
        - auto
    post:
      operationId: CreateEventRegistration
      summary: WildApricot Creates a New Event Registration.
      description: ''
      tags:
      - Events.EventRegistrations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationPost'
      parameters:
      - name: ''
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Event registration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistration'
        '400':
          description: ''
        '401':
          description: ''
        '429':
          description: ''
      security:
      - OAuth2:
        - auto
  /accounts/{accountId}/eventregistrations/{event_registration_id}:
    get:
      operationId: GetEventRegistrationDetails
      summary: WildApricot Event Registration Details
      description: ''
      tags:
      - Events.EventRegistrations
      parameters:
      - name: ''
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: event_registration_id
        in: path
        required: true
        description: event registration identifier
        schema:
          type: number
      responses:
        '200':
          description: List of Event Registrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistration'
        '400':
          description: ''
        '401':
          description: ''
        '429':
