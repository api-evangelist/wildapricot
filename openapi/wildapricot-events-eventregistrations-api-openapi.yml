      operationId: DeleteEventRegistration
      summary: WildApricot Event Registration
      description: ''
      tags:
      - Events.EventRegistrations
      parameters:
      - name: ''
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: event_registration_id
        in: path
        required: true
        description: event registration identifier
        schema:
          type: number
      responses:
        '200':
          description: OK
        '401':
          description: ''
        '404':
          description: ''
        '429':
          description: ''
      security:
      - OAuth2:
        - auto
    put:
      operationId: UpdateEventRegistration
      summary: WildApricot Update Event Registration.
      description: ''
      tags:
      - Events.EventRegistrations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationPut'
      parameters:
      - name: ''
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: event_registration_id
        in: path
        required: true
        description: event registration identifier
        schema:
          type: number
      responses:
        '200':
          description: Event registration created
          content:
